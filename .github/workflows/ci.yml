# Evaluates the flake, builds buzz-relay, and runs both NixOS VM tests.
#
# The VM tests need KVM. GitHub-hosted Linux runners expose /dev/kvm, but
# only root can open it until a udev rule widens the mode. The relay build is
# a large Rust workspace, so the job first frees disk space on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The runner image ships about 14 GB free. The cargo vendor directory,
      # the Rust toolchain, and the release build need more than that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = auto

      # Evaluation only: catches option errors (for example a removed
      # provisionMinio) in both example hosts and both checks before the
      # long build starts.
      - name: Evaluate flake
        run: nix flake check --no-build --print-build-logs

      - name: Build buzz-relay
        run: nix build .#buzz-relay --print-build-logs

      - name: Test relay-boot
        run: nix build .#checks.x86_64-linux.relay-boot --print-build-logs

      - name: Test full-stack
        run: nix build .#checks.x86_64-linux.full-stack --print-build-logs
